# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Unit test
        run: go test -race -count=1 -v ./...

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version change
        id: check_version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(sed -n 's/.*const Version = "\(.*\)".*/\1/p' version.go || true)
          echo "Current version in version.go: ${CURRENT_VERSION}"

          if [ -z "${CURRENT_VERSION}" ]; then
            echo "No version found in version.go, skipping release."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          PREV_VERSION=""
          if [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if git cat-file -e "${BEFORE_SHA}:version.go" 2>/dev/null; then
              PREV_VERSION=$(git show "${BEFORE_SHA}:version.go" | sed -n 's/.*const Version = "\(.*\)".*/\1/p' || true)
            fi
          fi
          echo "Previous version: ${PREV_VERSION}"

          if [ "${CURRENT_VERSION}" = "${PREV_VERSION}" ]; then
            echo "Version has not changed (${CURRENT_VERSION}), skipping release."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if git rev-parse "${CURRENT_VERSION}" >/dev/null 2>&1; then
            echo "Tag ${CURRENT_VERSION} already exists, skipping release to prevent duplicate."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Version changed from '${PREV_VERSION}' to '${CURRENT_VERSION}'. Triggering release!"
          echo "should_release=true" >> "${GITHUB_OUTPUT}"
          echo "version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        if: steps.check_version.outputs.should_release == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install zip
        if: steps.check_version.outputs.should_release == 'true'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build release artifacts
        if: steps.check_version.outputs.should_release == 'true'
        run: chmod +x pack.sh && ./pack.sh

      - name: Prepare release metadata
        if: steps.check_version.outputs.should_release == 'true'
        id: release_meta
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          VERSION: ${{ steps.check_version.outputs.version }}
        run: |
          set -euo pipefail

          TAG_NAME="${VERSION}"
          RELEASE_NAME="${VERSION}"

          if [ "${BEFORE_SHA}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            COMMIT_LINES="$(git log -n 10 --pretty='- %h %s' "${AFTER_SHA}")"
          else
            COMMIT_LINES="$(git log --pretty='- %h %s' "${BEFORE_SHA}..${AFTER_SHA}")"
          fi

          if [ -z "${COMMIT_LINES}" ]; then
            COMMIT_LINES="- ${AFTER_SHA:0:7} release version ${VERSION}"
          fi

          {
            echo "tag_name=${TAG_NAME}"
            echo "release_name=${RELEASE_NAME}"
            echo "body<<EOF"
            echo "Release ${VERSION} (${AFTER_SHA:0:7})"
            echo ""
            echo "## Commits"
            echo "${COMMIT_LINES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Create release and upload artifacts
        if: steps.check_version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body: ${{ steps.release_meta.outputs.body }}
          files: |
            pack.zip
            pack/*.zip
          fail_on_unmatched_files: true
